description: PAW32xx ultra low power wireless mouse chip

compatible: "pixart,paw3222"

include: spi-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description:
      GPIO connected to the motion pin, active low.

  power-gpios:
    type: phandle-array
    required: false
    description:
      GPIO connected to the power control pin.

  res-cpi:
    type: int
    description: |
      CPI resolution for the sensor. This can also be changed in runtime using
      the paw32xx_set_resolution() API.

  force-awake:
    type: boolean
    description: |
      Initialize the sensor in "force awake" mode. This can also be enabled or
      disabled in runtime by the application using the paw32xx_force_awake()
      API.

  invert-x:
    type: boolean
    description: |
      Invert the X axis reported by the sensor. Use when the sensor is mounted
      rotated relative to the keyboard.

  invert-y:
    type: boolean
    description: |
      Invert the Y axis reported by the sensor.

  swap-xy:
    type: boolean
    description: |
      Swap the X and Y axes reported by the sensor. Applied before invert-x /
      invert-y.

  no-invert-x:
    type: boolean
    description: |
      Disable the X axis inversion. In this fork the inversion is enabled by
      default because torabo-tsuki LP reports both axes reversed.

  no-invert-y:
    type: boolean
    description: |
      Disable the Y axis inversion. See no-invert-x.