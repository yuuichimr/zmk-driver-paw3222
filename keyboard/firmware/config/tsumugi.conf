# ---- Tsumugi user configuration ----------------------------------------

# Status LED: battery on boot, connection state, low-battery warning
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n

# Deep sleep after 30 min idle (wake with any key); ext-power (module bay 3V3)
# is switched off in deep sleep by ZMK.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Report the peripheral battery level to the host as well
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Better BLE range for a metal-free, low-profile case
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
